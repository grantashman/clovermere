name: Build Windows native release

on:
  push:
    tags:
      - 'native-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example native-v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
      GODOT_FLAVOR: 4.7.1.stable
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Godot and Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/bin" "$RUNNER_TEMP/godot/templates" "$HOME/.local/share/godot/export_templates/$GODOT_FLAVOR"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/$GODOT_FLAVOR/"
          echo "$RUNNER_TEMP/godot/bin" >> "$GITHUB_PATH"
      - name: Import and validate Godot project
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --quit --path desktop/godot
      - name: Run world and save contract before export
        run: |
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/world_contract_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/regrowth_state_test.gd
      - name: Run day-state and storage/recipe contracts before export
        run: |
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/day_state_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/storage_recipe_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/minimap_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/gameplay_hud_test.gd
      - name: Run work-action, workshop, and benchmark contracts before export
        run: |
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/work_action_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/workshop_upgrade_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/art_asset_pack_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/facade_asset_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/benchmark_scene_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/living_terrain_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/living_terrain_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/regrowth_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/work_feedback_smoke.gd
      - name: Run NPC schedule and actor contracts before export
        run: |
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/npc_schedule_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/npc_actor_test.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/player_scale_test.gd
      - name: Run desktop input and UI flow checks before export
        run: |
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/mouse_input_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/resource_interaction_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/day_loop_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/npc_live_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/ui_flow_smoke.gd
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --script res://tests/render_smoke.gd
      - name: Export Windows executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          preset = Path('desktop/godot/export_presets.cfg').read_text()
          assert 'binary_format/embed_pck=true' in preset, 'Windows export must embed project data'
          PY
          mkdir -p "$RUNNER_TEMP/clovermere-build"
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path desktop/godot --export-release "Windows Desktop" "$RUNNER_TEMP/clovermere-build/Clovermere.exe"
          test -s "$RUNNER_TEMP/clovermere-build/Clovermere.exe"
          test ! -e "$RUNNER_TEMP/clovermere-build/Clovermere.pck"
          cp desktop/godot/README.md "$RUNNER_TEMP/clovermere-build/README-native.md"
          cd "$RUNNER_TEMP/clovermere-build"
          zip -9 "Clovermere-${RELEASE_TAG}-windows-x86_64.zip" Clovermere.exe README-native.md
      - name: Create GitHub Release and upload Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/clovermere-build/Clovermere-${RELEASE_TAG}-windows-x86_64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clovermere ${RELEASE_TAG}" \
            --generate-notes
