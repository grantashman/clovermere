name: Verify desktop client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and validate Godot project
        run: godot --headless --editor --quit --path desktop/godot
      - name: Run world and save contract
        run: godot --headless --path desktop/godot --script res://tests/world_contract_test.gd
      - name: Run day-state contract
        run: godot --headless --path desktop/godot --script res://tests/day_state_test.gd
      - name: Run work-action and workshop contracts
        run: |
          godot --headless --path desktop/godot --script res://tests/work_action_test.gd
          godot --headless --path desktop/godot --script res://tests/workshop_upgrade_test.gd
      - name: Run benchmark and work-feedback contracts
        run: |
          godot --headless --path desktop/godot --script res://tests/art_asset_pack_test.gd
          godot --headless --path desktop/godot --script res://tests/terrain_asset_test.gd
          godot --headless --path desktop/godot --script res://tests/benchmark_scene_test.gd
          godot --headless --path desktop/godot --script res://tests/terrain_benchmark_test.gd
          godot --headless --path desktop/godot --script res://tests/living_terrain_test.gd
          godot --headless --path desktop/godot --script res://tests/living_terrain_smoke.gd
          godot --headless --path desktop/godot --script res://tests/work_feedback_smoke.gd
      - name: Run NPC schedule contract
        run: godot --headless --path desktop/godot --script res://tests/npc_schedule_test.gd
      - name: Run NPC actor contract
        run: godot --headless --path desktop/godot --script res://tests/npc_actor_test.gd
      - name: Smoke run desktop scene
        run: godot --headless --path desktop/godot --quit-after 3
      - name: Verify mouse movement and building interaction
        run: godot --headless --path desktop/godot --script res://tests/mouse_input_smoke.gd
      - name: Verify resource interaction and persistence
        run: godot --headless --path desktop/godot --script res://tests/resource_interaction_smoke.gd
      - name: Verify first day loop
        run: godot --headless --path desktop/godot --script res://tests/day_loop_smoke.gd
      - name: Verify live NPC schedules and movement
        run: godot --headless --path desktop/godot --script res://tests/npc_live_smoke.gd
      - name: Verify welcome, options, and save/load flow
        run: godot --headless --path desktop/godot --script res://tests/ui_flow_smoke.gd
      - name: Measure steady-state native renderer
        run: godot --headless --path desktop/godot --script res://tests/render_smoke.gd
